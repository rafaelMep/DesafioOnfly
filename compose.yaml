name: onfly-travel

x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "false"
  APP_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  APP_LOCALE: pt_BR
  DB_CONNECTION: pgsql
  DB_HOST: database
  DB_PORT: 5432
  DB_DATABASE: onfly
  DB_USERNAME: onfly
  DB_PASSWORD: ${DB_PASSWORD:-onfly-local-only}
  CACHE_STORE: database
  SESSION_DRIVER: array
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: viagens@onfly.test
  MAIL_FROM_NAME: Onfly Travel
  LOG_CHANNEL: stderr

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onfly
      POSTGRES_USER: onfly
      POSTGRES_PASSWORD: ${DB_PASSWORD:-onfly-local-only}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onfly -d onfly"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    build: ./backend
    image: onfly-backend:local
    command: [sh, /var/www/html/docker/init.sh]
    environment: *app-environment
    volumes:
      - storage:/var/www/html/storage
      - secrets:/var/www/html/runtime
    depends_on:
      database:
        condition: service_healthy

  backend:
    image: onfly-backend:local
    environment: *app-environment
    volumes:
      - storage:/var/www/html/storage
      - secrets:/var/www/html/runtime
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./docker/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/up]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: onfly-backend:local
    user: www-data
    command: [php, artisan, queue:work, --sleep=1, --tries=3, --timeout=60]
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - storage:/var/www/html/storage
      - secrets:/var/www/html/runtime
    depends_on:
      init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  database:
  storage:
  secrets:
